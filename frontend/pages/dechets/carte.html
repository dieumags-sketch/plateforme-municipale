<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points de collecte - Bot-Makak</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .container{height:calc(100vh - 70px);margin-top:70px;position:relative}
        #map{height:100%;width:100%}
        .info-panel{position:absolute;bottom:20px;left:20px;right:20px;background:white;border-radius:20px;padding:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.1);max-height:200px;overflow-y:auto;z-index:1000}
        .filter-bar{position:absolute;top:20px;right:20px;background:white;border-radius:12px;padding:0.5rem;z-index:1000;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        .filter-bar select{padding:0.5rem;border:none;border-radius:8px}
        .itinerary-btn{background:#059669;color:white;border:none;padding:0.5rem;border-radius:8px;margin-left:0.5rem;cursor:pointer}
    </style>
</head>
<body>
    <nav class="navbar">...</nav>
    
    <div class="container">
        <div id="map"></div>
        <div class="filter-bar">
            <select id="type-filter">
                <option value="">Tous les types</option>
                <option value="bac_240">Bac 240L</option>
                <option value="bac_660">Bac 660L</option>
                <option value="bac_1100">Bac 1100L</option>
                <option value="container">Container</option>
            </select>
            <button id="geoloc-btn" class="itinerary-btn"><i class="fas fa-location-dot"></i> Ma position</button>
        </div>
        <div id="info-panel" class="info-panel"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000/api/dechets';
        let map, markers = [], currentLocation = null;
        
        function initMap() {
            map = L.map('map').setView([4.05, 9.77], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
            }).addTo(map);
        }
        
        async function loadPoints() {
            const type = document.getElementById('type-filter').value;
            let url = `${API_BASE}/points/`;
            if (type) url += `?type=${type}`;
            
            const response = await fetch(url);
            const points = await response.json();
            
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            points.forEach(p => {
                if (p.latitude && p.longitude) {
                    const couleur = p.statut === 'plein' ? '#ef4444' : (p.statut === 'casse' ? '#f59e0b' : '#059669');
                    const marker = L.marker([parseFloat(p.latitude), parseFloat(p.longitude)], {
                        icon: L.divIcon({html: `<div style="background:${couleur};width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,0.3)"></div>`, iconSize: [12,12]})
                    }).bindPopup(`
                        <b>${p.type_display || p.type}</b><br>
                        📍 ${p.adresse_reference}<br>
                        📊 Statut: ${p.statut}<br>
                        🗑️ Dernier vidage: ${p.dernier_vidage ? new Date(p.dernier_vidage).toLocaleDateString() : 'N/A'}
                    `).addTo(map);
                    markers.push(marker);
                }
            });
        }
        
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    currentLocation = [pos.coords.latitude, pos.coords.longitude];
                    map.setView(currentLocation, 15);
                    L.marker(currentLocation).bindPopup('Vous êtes ici').addTo(map);
                    document.getElementById('info-panel').innerHTML = '<div>📍 Position détectée. Les points de collecte sont affichés sur la carte.</div>';
                });
            }
        }
        
        document.getElementById('geoloc-btn').addEventListener('click', getUserLocation);
        document.getElementById('type-filter').addEventListener('change', loadPoints);
        
        initMap();
        loadPoints();
    </script>
</body>
</html>
