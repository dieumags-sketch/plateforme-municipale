<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Agent - Tournées | Bot-Makak Propre</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f3f4f6}
        .navbar{background:#059669;color:white;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:1.5rem;font-weight:bold}
        .nav-links{display:flex;gap:2rem}
        .nav-links a{color:white;text-decoration:none}
        .agent-container{display:flex;height:calc(100vh - 70px)}
        .sidebar{width:350px;background:white;border-right:1px solid #e5e7eb;overflow-y:auto}
        .tournee-header{background:#059669;color:white;padding:1rem}
        .tournee-info{padding:1rem;background:#f0fdf4;border-bottom:1px solid #e5e7eb}
        .points-list{padding:1rem}
        .point-item{background:#f9fafb;border-radius:12px;padding:1rem;margin-bottom:0.75rem;cursor:pointer;transition:all 0.3s}
        .point-item:hover{background:#f3f4f6}
        .point-item.vide{background:#d1fae5;border-left:4px solid #059669}
        .point-nom{font-weight:600;margin-bottom:0.25rem}
        .point-adresse{font-size:0.75rem;color:#6b7280}
        .point-status{font-size:0.7rem;margin-top:0.5rem;display:inline-block;padding:0.25rem 0.5rem;border-radius:20px}
        .status-pending{background:#fef3c7;color:#d97706}
        .status-done{background:#d1fae5;color:#059669}
        .map-container{flex:1;position:relative}
        #map{height:100%;width:100%}
        .action-buttons{position:absolute;bottom:20px;right:20px;z-index:1000;display:flex;gap:0.5rem}
        .btn-action{background:#059669;color:white;border:none;padding:0.75rem 1rem;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:0.5rem;font-weight:500}
        .btn-action.offline{background:#6b7280}
        .sync-status{position:absolute;top:20px;right:20px;background:white;padding:0.5rem 1rem;border-radius:20px;font-size:0.75rem;z-index:1000;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        .sync-status.online{color:#059669}
        .sync-status.offline{color:#ef4444}
        .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center}
        .modal-content{background:white;border-radius:20px;padding:2rem;max-width:400px;width:90%}
        .modal-buttons{display:flex;gap:1rem;margin-top:1.5rem}
        .btn-primary{background:#059669;color:white;padding:0.5rem 1rem;border:none;border-radius:8px;cursor:pointer}
        .btn-secondary{background:#e5e7eb;padding:0.5rem 1rem;border:none;border-radius:8px;cursor:pointer}
        .camera-preview{width:100%;height:200px;background:#f3f4f6;border-radius:12px;margin:1rem 0;display:flex;align-items:center;justify-content:center}
        video, canvas{width:100%;border-radius:12px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:0.75rem 1.5rem;border-radius:30px;z-index:3000}
        @media (max-width:768px){.sidebar{width:280px}}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-trash-alt"></i> Agent Bot-Makak</div>
        <div class="nav-links">
            <a href="dashboard.html">Tableau de bord</a>
            <a href="#" id="logout-btn">Déconnexion</a>
        </div>
    </nav>

    <div class="agent-container">
        <div class="sidebar">
            <div class="tournee-header">
                <h3><i class="fas fa-truck"></i> Tournée du jour</h3>
            </div>
            <div id="tournee-info" class="tournee-info">
                <p>Chargement...</p>
            </div>
            <div id="points-list" class="points-list">
                <div style="text-align:center;padding:2rem">Chargement des points...</div>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
            <div id="sync-status" class="sync-status online">
                <i class="fas fa-wifi"></i> Connecté
            </div>
            <div class="action-buttons">
                <button id="start-tournee-btn" class="btn-action"><i class="fas fa-play"></i> Démarrer</button>
                <button id="end-tournee-btn" class="btn-action" style="background:#ef4444"><i class="fas fa-stop"></i> Terminer</button>
            </div>
        </div>
    </div>

    <!-- Modal pour valider un point -->
    <div id="validate-modal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-check-circle"></i> Valider le vidage</h3>
            <p id="point-name">Point de collecte</p>
            <div class="camera-preview" id="camera-preview">
                <i class="fas fa-camera" style="font-size:2rem;color:#9ca3af"></i>
                <span>Prenez une photo</span>
            </div>
            <video id="video" autoplay playsinline style="display:none"></video>
            <canvas id="canvas" style="display:none"></canvas>
            <button id="take-photo-btn" class="btn-primary" style="width:100%;margin-bottom:1rem"><i class="fas fa-camera"></i> Prendre une photo</button>
            <textarea id="commentaire" placeholder="Commentaire (optionnel)" rows="2" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid #e5e7eb"></textarea>
            <div class="modal-buttons">
                <button id="confirm-validate" class="btn-primary">Valider</button>
                <button id="close-modal" class="btn-secondary">Annuler</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000/api/dechets';
        const token = localStorage.getItem('auth_token');
        let map, markers = [], currentTournee = null, currentPoint = null;
        let tourneeEnCours = false;
        let stream = null;

        if (!token) window.location.href = '../../accounts/login.html';

        // Vérifier le rôle (doit être agent)
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.role !== 'agent' && user.role !== 'admin') {
            alert('Accès réservé aux agents');
            window.location.href = '../../index.html';
        }

        // Initialisation de la carte
        function initMap() {
            map = L.map('map').setView([4.05, 9.77], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
            }).addTo(map);
        }

        // Charger la tournée du jour
        async function loadTourneeDuJour() {
            try {
                const response = await fetch(`${API_BASE}/tournee-du-jour/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const tournees = await response.json();
                
                if (tournees.length === 0) {
                    document.getElementById('tournee-info').innerHTML = '<p>Aucune tournée programmée pour aujourd\'hui</p>';
                    document.getElementById('points-list').innerHTML = '<div style="text-align:center;padding:2rem">Aucun point à visiter</div>';
                    return;
                }
                
                currentTournee = tournees[0];
                updateTourneeUI();
                updateMap();
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        function updateTourneeUI() {
            const infoDiv = document.getElementById('tournee-info');
            infoDiv.innerHTML = `
                <p><strong>📅 Date:</strong> ${new Date(currentTournee.date).toLocaleDateString('fr-FR')}</p>
                <p><strong>📍 Quartier:</strong> ${currentTournee.quartier_nom}</p>
                <p><strong>🗑️ Points:</strong> ${currentTournee.points?.length || 0} bacs à visiter</p>
                <p><strong>⏱️ Statut:</strong> <span style="color:${currentTournee.statut === 'en_cours' ? '#059669' : '#d97706'}">${currentTournee.statut === 'en_cours' ? 'En cours' : 'Planifiée'}</span></p>
            `;
            
            const pointsList = document.getElementById('points-list');
            if (currentTournee.points && currentTournee.points.length) {
                pointsList.innerHTML = currentTournee.points
                    .sort((a,b) => a.ordre - b.ordre)
                    .map(point => `
                        <div class="point-item ${point.est_vide ? 'vide' : ''}" data-id="${point.point}" data-ordre="${point.ordre}" onclick="selectionnerPoint(${point.point}, '${point.point_nom}', ${point.ordre})">
                            <div class="point-nom">${point.ordre}. ${point.point_nom || 'Point sans nom'}</div>
                            <div class="point-adresse">Code: ${point.point_code || 'N/A'}</div>
                            <span class="point-status ${point.est_vide ? 'status-done' : 'status-pending'}">
                                ${point.est_vide ? '✅ Vidé' : '⏳ En attente'}
                            </span>
                        </div>
                    `).join('');
            } else {
                pointsList.innerHTML = '<div style="text-align:center;padding:2rem">Aucun point</div>';
            }
            
            tourneeEnCours = currentTournee.statut === 'en_cours';
            updateButtons();
        }

        function updateMap() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            if (currentTournee.points) {
                currentTournee.points.forEach(point => {
                    if (point.latitude && point.longitude) {
                        const couleur = point.est_vide ? '#059669' : '#f59e0b';
                        const marker = L.marker([point.latitude, point.longitude])
                            .bindPopup(`
                                <b>${point.point_nom}</b><br>
                                ${point.est_vide ? '✅ Vidé' : '⏳ En attente'}<br>
                                <button onclick="selectionnerPoint(${point.point}, '${point.point_nom}', ${point.ordre})">Valider</button>
                            `)
                            .addTo(map);
                        markers.push(marker);
                    }
                });
            }
        }

        function selectionnerPoint(pointId, pointNom, ordre) {
            if (!tourneeEnCours) {
                alert('Veuillez d\'abord démarrer la tournée');
                return;
            }
            currentPoint = { id: pointId, nom: pointNom, ordre: ordre };
            document.getElementById('point-name').innerHTML = `<strong>${pointNom}</strong>`;
            document.getElementById('validate-modal').style.display = 'flex';
        }

        async function demarrerTournee() {
            try {
                const response = await fetch(`${API_BASE}/tournees/${currentTournee.id}/commencer/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    tourneeEnCours = true;
                    currentTournee.statut = 'en_cours';
                    updateButtons();
                    showToast('Tournée démarrée !');
                    loadTourneeDuJour();
                }
            } catch (error) {
                showToast('Erreur', 'error');
            }
        }

        async function terminerTournee() {
            if (confirm('Terminer la tournée ?')) {
                try {
                    const response = await fetch(`${API_BASE}/tournees/${currentTournee.id}/terminer/`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        tourneeEnCours = false;
                        showToast('Tournée terminée !');
                        loadTourneeDuJour();
                    }
                } catch (error) {
                    showToast('Erreur', 'error');
                }
            }
        }

        async function validerPoint() {
            if (!currentPoint) return;
            
            const photoInput = document.getElementById('photo-input');
            const commentaire = document.getElementById('commentaire').value;
            
            const formData = new FormData();
            formData.append('point_id', currentPoint.id);
            formData.append('commentaire', commentaire);
            
            // Récupérer la photo prise
            const photoData = localStorage.getItem(`photo_${currentPoint.id}`);
            if (photoData) {
                const blob = dataURLtoBlob(photoData);
                formData.append('photo', blob, 'preuve.jpg');
                localStorage.removeItem(`photo_${currentPoint.id}`);
            }
            
            try {
                const response = await fetch(`${API_BASE}/tournees/${currentTournee.id}/valider_point/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                if (response.ok) {
                    showToast('Point validé !');
                    document.getElementById('validate-modal').style.display = 'none';
                    document.getElementById('commentaire').value = '';
                    loadTourneeDuJour();
                } else {
                    showToast('Erreur lors de la validation', 'error');
                }
            } catch (error) {
                showToast('Erreur de connexion', 'error');
            }
        }

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }

        function updateButtons() {
            const startBtn = document.getElementById('start-tournee-btn');
            const endBtn = document.getElementById('end-tournee-btn');
            if (tourneeEnCours) {
                startBtn.style.display = 'none';
                endBtn.style.display = 'flex';
            } else {
                startBtn.style.display = 'flex';
                endBtn.style.display = 'none';
            }
        }

        // Gestion de la caméra pour la photo preuve
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('camera-preview').style.display = 'none';
            } catch (err) {
                alert('Impossible d\'accéder à la caméra');
            }
        }

        function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const photoData = canvas.toDataURL('image/jpeg');
            localStorage.setItem(`photo_${currentPoint?.id}`, photoData);
            
            // Afficher l'aperçu
            const preview = document.getElementById('camera-preview');
            preview.innerHTML = `<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`;
            preview.style.display = 'flex';
            
            // Arrêter la caméra
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
            }
        }

        document.getElementById('start-tournee-btn').addEventListener('click', demarrerTournee);
        document.getElementById('end-tournee-btn').addEventListener('click', terminerTournee);
        document.getElementById('confirm-validate').addEventListener('click', validerPoint);
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('validate-modal').style.display = 'none';
            if (stream) stream.getTracks().forEach(track => track.stop());
        });
        document.getElementById('take-photo-btn').addEventListener('click', () => {
            if (!stream) startCamera();
            else takePhoto();
        });

        // Détection online/offline
        window.addEventListener('online', () => {
            document.getElementById('sync-status').innerHTML = '<i class="fas fa-wifi"></i> Connecté';
            document.getElementById('sync-status').className = 'sync-status online';
            loadTourneeDuJour();
        });
        window.addEventListener('offline', () => {
            document.getElementById('sync-status').innerHTML = '<i class="fas fa-wifi-slash"></i> Hors ligne';
            document.getElementById('sync-status').className = 'sync-status offline';
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            window.location.href = '../../accounts/login.html';
        });

        initMap();
        loadTourneeDuJour();
        
        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'success' ? '#059669' : '#ef4444';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
