<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérifier une signature - Commune Bot-Makak</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/modules/signature.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">[MENU]</nav>

    <div class="signature-header">
        <h1><i class="fas fa-check-double"></i> Vérifier une signature</h1>
        <p>Vérifiez l'authenticité d'un document signé</p>
    </div>

    <div class="form-container">
        <div class="form-card">
            <div id="signatureInfo" class="certificat-card">
                <div class="loading-container"><div class="spinner"></div><p>Chargement des informations...</p></div>
            </div>

            <div class="form-section-title"><i class="fas fa-qrcode"></i> Scanner le QR code</div>
            <div class="qr-scanner-area" style="text-align: center; padding: 20px;">
                <div id="qr-reader" style="width: 300px; height: 300px; margin: 0 auto;"></div>
                <p style="margin-top: 16px;">Ou entrez manuellement l'ID de la signature</p>
            </div>

            <div class="form-group">
                <label>ID de la signature</label>
                <input type="text" id="signatureId" class="search-input" placeholder="Ex: 123e4567-e89b-12d3-a456-426614174000">
            </div>

            <div class="form-section-title"><i class="fas fa-draw-polygon"></i> Document à vérifier</div>
            <div class="signature-area">
                <canvas id="signatureCanvas" class="signature-canvas" width="500" height="150"></canvas>
                <div class="signature-actions">
                    <button class="btn-secondary" onclick="clearCanvas()">🔄 Effacer</button>
                </div>
            </div>

            <button class="btn-primary" onclick="verifierSignature()" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-search"></i> Vérifier la signature
            </button>

            <div id="verificationResult" class="verification-result" style="display: none;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/modules/signature.js"></script>
</body>
</html>
