<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signer un document - Signature externe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/modules/signature.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="signature-header">
        <h1><i class="fas fa-envelope-open-text"></i> Signature de document</h1>
        <p>Vous avez été invité à signer ce document</p>
    </div>

    <div class="form-container">
        <div class="form-card">
            <div id="demandeInfo" class="certificat-card">
                <div class="loading-container"><div class="spinner"></div><p>Chargement...</p></div>
            </div>

            <div class="form-section-title"><i class="fas fa-paint-brush"></i> Votre signature</div>
            <div class="signature-area">
                <canvas id="signatureCanvas" class="signature-canvas" width="500" height="150"></canvas>
                <div class="signature-actions">
                    <button class="btn-secondary" onclick="clearCanvas()">🔄 Effacer</button>
                </div>
            </div>

            <div class="form-section-title"><i class="fas fa-lock"></i> Authentification</div>
            <div class="form-group">
                <label>Mot de passe de votre certificat</label>
                <input type="password" id="motDePasseToken" class="search-input" placeholder="Votre mot de passe">
            </div>
            <div class="form-group">
                <label>Niveau de signature</label>
                <select id="niveauSignature" class="filter-select">
                    <option value="1">Signature simple</option>
                    <option value="2">Signature avancée</option>
                    <option value="3">Signature qualifiée</option>
                </select>
            </div>

            <button class="btn-primary" onclick="signerAvecToken()" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-signature"></i> Signer le document
            </button>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/modules/signature.js"></script>
</body>
</html>
