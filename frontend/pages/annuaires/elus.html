<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Élus municipaux - Plateforme Municipale</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .elus-container{max-width:1200px;margin:100px auto 2rem;padding:0 2rem}
        .section-title{text-align:center;margin-bottom:2rem}
        .filters-elus{display:flex;justify-content:center;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
        .filter-btn{padding:0.5rem 1rem;background:#f3f4f6;border:none;border-radius:20px;cursor:pointer}
        .filter-btn.active{background:#667eea;color:white}
        .elus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem}
        .elu-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.1);transition:transform 0.3s}
        .elu-card:hover{transform:translateY(-5px)}
        .elu-photo{height:200px;background:#667eea;display:flex;align-items:center;justify-content:center}
        .elu-photo i{font-size:4rem;color:white}
        .elu-photo img{width:100%;height:100%;object-fit:cover}
        .elu-info{padding:1.5rem}
        .elu-info h3{margin-bottom:0.25rem}
        .elu-fonction{color:#667eea;font-weight:600;margin-bottom:0.5rem}
        .elu-contact{display:flex;gap:1rem;margin-top:1rem}
        .elu-contact a{color:#6b7280;text-decoration:none}
        .elu-contact a:hover{color:#667eea}
        @media (max-width:768px){.elus-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <nav class="navbar">...</nav>
    <div class="elus-container">
        <div class="section-title">
            <h1><i class="fas fa-user-tie"></i> Élus municipaux</h1>
            <p>Découvrez vos représentants à la mairie</p>
        </div>
        <div class="filters-elus" id="filters-elus"></div>
        <div class="elus-grid" id="elus-grid"></div>
    </div>
    <script>
        const API_BASE = 'http://localhost:8000/api/annuaires';
        let elusData = [];
        
        async function loadElus(fonction = '') {
            let url = `${API_BASE}/elus/`;
            if(fonction) url += `?fonction=${fonction}`;
            const response = await fetch(url);
            elusData = await response.json();
            renderElus(elusData);
        }
        
        function renderElus(elus) {
            const grid = document.getElementById('elus-grid');
            grid.innerHTML = elus.map(e => `
                <div class="elu-card">
                    <div class="elu-photo">
                        ${e.photo ? `<img src="${e.photo}" alt="${e.prenom} ${e.nom}">` : `<i class="fas fa-user-circle"></i>`}
                    </div>
                    <div class="elu-info">
                        <h3>${e.prenom} ${e.nom}</h3>
                        <div class="elu-fonction">${e.titre || e.get_fonction_display}</div>
                        <p>${e.biographie?.substring(0, 100) || ''}...</p>
                        <div class="elu-contact">
                            ${e.telephone ? `<a href="tel:${e.telephone}"><i class="fas fa-phone"></i></a>` : ''}
                            ${e.email ? `<a href="mailto:${e.email}"><i class="fas fa-envelope"></i></a>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function loadFilters() {
            const fonctions = [
                {value:'', label:'Tous'},{value:'maire',label:'Maire'},
                {value:'adjoint',label:'Adjoint'},{value:'conseiller',label:'Conseiller'}
            ];
            const container = document.getElementById('filters-elus');
            container.innerHTML = fonctions.map(f => `<button class="filter-btn" data-fonction="${f.value}">${f.label}</button>`).join('');
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadElus(btn.dataset.fonction);
                });
            });
            document.querySelector('.filter-btn').classList.add('active');
        }
        
        loadFilters();
        loadElus();
    </script>
</body>
</html>
