<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des activités - Admin</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header"><i class="fas fa-city"></i><span>Admin Municipal</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Tableau de bord</a>
                <a href="activites.html" class="active"><i class="fas fa-calendar-alt"></i> Activités</a>
                <a href="inscriptions.html"><i class="fas fa-users"></i> Inscriptions</a>
            </nav>
        </aside>
        <main class="admin-main">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1>Gestion des activités</h1>
                <a href="activite-form.html" class="btn-primary" style="padding: 0.5rem 1rem;">+ Nouvelle activité</a>
            </div>
            <table class="admin-table">
                <thead><tr><th>Titre</th><th>Type</th><th>Date</th><th>Statut</th><th>Inscrits</th><th>Actions</th></tr></thead>
                <tbody id="activites-list"><tr><td colspan="6">Chargement...</td></tr></tbody>
            </table>
        </main>
    </div>
    <script>
        const API_BASE = 'http://localhost:8000/api/activites';
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = '../../accounts/login.html';
        
        async function loadActivites() {
            try {
                const response = await fetch(`${API_BASE}/activites/?page_size=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const tbody = document.getElementById('activites-list');
                if (data.results && data.results.length) {
                    tbody.innerHTML = data.results.map(act => `
                        <tr>
                            <td><a href="activite-form.html?id=${act.id}">${escapeHtml(act.titre)}</a></td>
                            <td>${act.type_activite}</td>
                            <td>${new Date(act.date_debut).toLocaleDateString('fr-FR')}</td>
                            <td><span class="status-badge">${act.statut}</span></td>
                            <td>${act.nb_inscrits || 0}</td>
                            <td><button onclick="supprimer(${act.id})" style="background:#ef4444; border:none; padding:0.25rem 0.5rem; border-radius:5px; color:white; cursor:pointer;"><i class="fas fa-trash"></i></button></td>
                        </tr>
                    `).join('');
                } else { tbody.innerHTML = '<tr><td colspan="6">Aucune activité</td></tr>'; }
            } catch (error) { console.error('Erreur:', error); }
        }
        async function supprimer(id) { if (confirm('Supprimer ?')) { await fetch(`${API_BASE}/activites/${id}/`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadActivites(); } }
        function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        loadActivites();
    </script>
</body>
</html>
