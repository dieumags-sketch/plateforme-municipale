<!-- frontend/pages/accounts/login.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plateforme Municipale</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@passwordless-id/webauthn"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-city"></i>
                    <span>Plateforme Municipale</span>
                </div>
                <h1>Connexion</h1>
                <p>Accédez à vos services municipaux</p>
            </div>

            <!-- Onglets de connexion -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="classic">Email / Téléphone</button>
                <button class="tab-btn" data-tab="face">Reconnaissance faciale</button>
                <button class="tab-btn" data-tab="passkey">Clé de sécurité</button>
            </div>

            <!-- Formulaire classique -->
            <form id="classic-login" class="auth-form active">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email ou nom d'utilisateur</label>
                    <input type="text" id="login-username" placeholder="exemple@email.com ou username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="login-password" placeholder="Votre mot de passe" required>
                        <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group" id="totp-group" style="display: none;">
                    <label><i class="fas fa-shield-alt"></i> Code 2FA</label>
                    <input type="text" id="totp-code" placeholder="Code à 6 chiffres" maxlength="6">
                </div>
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="remember-me"> Se souvenir de moi
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-auth">Se connecter</button>
            </form>

            <!-- Formulaire reconnaissance faciale -->
            <form id="face-login" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="face-email" placeholder="votre@email.com" required>
                </div>
                <div class="face-preview">
                    <div class="face-camera" id="face-camera">
                        <video id="face-video" autoplay playsinline></video>
                        <canvas id="face-canvas" style="display: none;"></canvas>
                        <div class="face-overlay">
                            <i class="fas fa-camera"></i>
                            <span>Positionnez votre visage</span>
                        </div>
                    </div>
                    <button type="button" id="start-camera" class="btn-camera">
                        <i class="fas fa-video"></i> Activer la caméra
                    </button>
                </div>
                <button type="submit" id="face-submit" class="btn-auth" disabled>
                    <i class="fas fa-face-smile"></i> Se connecter avec le visage
                </button>
            </form>

            <!-- Formulaire clé de sécurité (WebAuthn) -->
            <form id="passkey-login" class="auth-form">
                <div class="passkey-info">
                    <i class="fas fa-key"></i>
                    <p>Connectez-vous avec votre clé de sécurité (YubiKey, Touch ID, Windows Hello)</p>
                </div>
                <button type="button" id="passkey-login-btn" class="btn-auth">
                    <i class="fas fa-fingerprint"></i> Utiliser ma clé de sécurité
                </button>
            </form>

            <!-- Séparation -->
            <div class="auth-divider">
                <span>ou</span>
            </div>

            <!-- Connexion sociale -->
            <div class="social-login">
                <button id="google-login" class="social-btn google">
                    <i class="fab fa-google"></i> Google
                </button>
                <button id="facebook-login" class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
                <button id="apple-login" class="social-btn apple">
                    <i class="fab fa-apple"></i> Apple
                </button>
            </div>

            <div class="auth-footer">
                <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/auth.js"></script>
    <script src="../../js/modules/face-auth.js"></script>
    <script src="../../js/modules/passkey.js"></script>
    <script src="../../js/modules/social-auth.js"></script>
</body>
</html>
