<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Plateforme Municipale</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-city"></i>
                    <span>Plateforme Municipale</span>
                </div>
                <h1>Créer un compte</h1>
                <p>Accédez à tous les services municipaux</p>
            </div>

            <form id="register-form" class="auth-form active">
                <div class="form-row" style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label><i class="fas fa-user"></i> Prénom</label>
                        <input type="text" id="reg-prenom" placeholder="Votre prénom" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label><i class="fas fa-user"></i> Nom</label>
                        <input type="text" id="reg-nom" placeholder="Votre nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Adresse email</label>
                    <input type="email" id="reg-email" placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-user-circle"></i> Nom d'utilisateur</label>
                    <input type="text" id="reg-username" placeholder="Nom d'utilisateur unique" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Téléphone (optionnel)</label>
                    <input type="tel" id="reg-phone" placeholder="+237 612345678">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <div class="password-input" style="position: relative;">
                        <input type="password" id="reg-password" style="width: 100%; padding: 0.875rem;" placeholder="Au moins 8 caractères" required>
                        <button type="button" class="toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">👁️</button>
                    </div>
                    <div id="password-strength" style="font-size: 0.75rem; margin-top: 0.25rem;"></div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirmer le mot de passe</label>
                    <div class="password-input" style="position: relative;">
                        <input type="password" id="reg-confirm-password" style="width: 100%; padding: 0.875rem;" placeholder="Retapez votre mot de passe" required>
                        <button type="button" class="toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="reg-terms" required>
                        J'accepte les conditions générales d'utilisation
                    </label>
                </div>

                <button type="submit" class="btn-auth" style="width: 100%; padding: 0.875rem; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;">Créer mon compte</button>
            </form>

            <div class="auth-divider" style="text-align: center; margin: 1.5rem 0; position: relative;">
                <span style="background: white; padding: 0 1rem;">ou</span>
            </div>

            <div class="social-login" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <button id="google-register" class="social-btn" style="flex: 1; padding: 0.75rem; border: 1px solid #e5e7eb; background: white; border-radius: 12px; cursor: pointer;">Google</button>
                <button id="facebook-register" class="social-btn" style="flex: 1; padding: 0.75rem; border: 1px solid #e5e7eb; background: white; border-radius: 12px; cursor: pointer;">Facebook</button>
            </div>

            <div class="auth-footer" style="text-align: center; padding-top: 1rem;">
                <p>Déjà un compte ? <a href="login.html" style="color: #667eea;">Se connecter</a></p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈';
                } else {
                    input.type = 'password';
                    this.textContent = '👁️';
                }
            });
        });
        
        // Password strength
        const passwordInput = document.getElementById('reg-password');
        const strengthDiv = document.getElementById('password-strength');
        
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;
            
            let strengthText = '', strengthColor = '';
            if (password.length === 0) {
                strengthText = '';
            } else if (strength <= 1) {
                strengthText = 'Faible';
                strengthColor = '#ef4444';
            } else if (strength <= 2) {
                strengthText = 'Moyen';
                strengthColor = '#f59e0b';
            } else {
                strengthText = 'Fort';
                strengthColor = '#10b981';
            }
            
            strengthDiv.innerHTML = strengthText ? `<span style="color: ${strengthColor}">● ${strengthText}</span>` : '';
        });
        
        // API calls
        const API_BASE = 'http://localhost:8000/api/accounts';
        
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.style.cssText = `position: fixed; bottom: 20px; right: 20px; background: ${type === 'success' ? '#10b981' : '#ef4444'}; color: white; padding: 1rem; border-radius: 8px; z-index: 9999;`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        async function register(userData) {
            try {
                const response = await fetch(`${API_BASE}/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Inscription réussie ! Vérifiez votre email.', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    return { success: true };
                } else {
                    const errors = Object.values(data).flat().join(', ');
                    showToast(errors || 'Erreur lors de l\'inscription', 'error');
                    return { success: false };
                }
            } catch (error) {
                showToast('Erreur de connexion au serveur', 'error');
                return { success: false };
            }
        }
        
        // Form submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm-password').value;
            
            if (password !== confirm) {
                showToast('Les mots de passe ne correspondent pas', 'error');
                return;
            }
            
            const userData = {
                email: document.getElementById('reg-email').value,
                username: document.getElementById('reg-username').value,
                nom: document.getElementById('reg-nom').value,
                prenom: document.getElementById('reg-prenom').value,
                telephone: document.getElementById('reg-phone').value || '',
                password: password,
                password2: confirm
            };
            
            await register(userData);
        });
    </script>
</body>
</html>
