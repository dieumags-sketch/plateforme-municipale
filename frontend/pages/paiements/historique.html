<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des paiements - Commune Bot-Makak</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/modules/paiements.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">[MENU]</nav>

    <div class="paiements-header">
        <h1><i class="fas fa-history"></i> Historique des paiements</h1>
        <p>Retrouvez toutes vos transactions</p>
    </div>

    <div class="form-container" style="max-width: 1200px; margin: 0 auto; padding: 32px;">
        <!-- Filtres -->
        <div class="form-card" style="margin-bottom: 24px;">
            <div class="form-section-title"><i class="fas fa-filter"></i> Filtrer</div>
            <div class="filters-row">
                <div class="filter-group">
                    <label>Période</label>
                    <select id="periodeFilter" class="filter-select">
                        <option value="all">Toutes les périodes</option>
                        <option value="today">Aujourd'hui</option>
                        <option value="week">Cette semaine</option>
                        <option value="month">Ce mois</option>
                        <option value="3months">3 derniers mois</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Statut</label>
                    <select id="statutFilter" class="filter-select">
                        <option value="all">Tous les statuts</option>
                        <option value="confirme">Confirmés</option>
                        <option value="en_attente">En attente</option>
                        <option value="echoue">Échoués</option>
                        <option value="annule">Annulés</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Mode</label>
                    <select id="modeFilter" class="filter-select">
                        <option value="all">Tous les modes</option>
                        <option value="mtn">MTN Mobile Money</option>
                        <option value="orange">Orange Money</option>
                        <option value="virement">Virement bancaire</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Recherche</label>
                    <input type="text" id="searchInput" class="search-input" placeholder="Référence...">
                </div>
            </div>
            <div class="filters-actions">
                <button class="btn-secondary" onclick="resetFilters()">Réinitialiser</button>
                <button class="btn-primary" onclick="applyFilters()">Appliquer</button>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px;">
            <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #059669); color: white;">
                <h3>Total payé</h3>
                <p class="stat-number" id="totalPaye">0 FCFA</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;">
                <h3>Transactions</h3>
                <p class="stat-number" id="totalTransactions">0</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white;">
                <h3>Confirmées</h3>
                <p class="stat-number" id="totalConfirmees">0</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white;">
                <h3>En attente</h3>
                <p class="stat-number" id="totalEnAttente">0</p>
            </div>
        </div>

        <!-- Liste des transactions -->
        <div class="form-card">
            <div class="form-section-title"><i class="fas fa-list"></i> Mes transactions</div>
            <div class="transactions-list" id="transactionsList">
                <div class="loading-container"><div class="spinner"></div><p>Chargement...</p></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Modal détail transaction -->
    <div id="detailModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Détail de la transaction</h2>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/modules/paiements.js"></script>
</body>
</html>
