<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - État Civil | Commune Bot-Makak</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/modules/etat-civil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-city"></i><span>Plateforme Municipale</span></div>
            <div class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-menu">
                <li><a href="../../../index.html">Accueil</a></li>
                <li><a href="#" class="active">Admin État Civil</a></li>
                <li><a href="../../../accounts/login.html" class="btn-login"><i class="fas fa-user"></i> Admin</a></li>
            </ul>
        </div>
    </nav>

    <div class="etat-civil-header">
        <h1><i class="fas fa-file-alt"></i> Administration - État Civil</h1>
        <p>Gestion des demandes d'actes</p>
    </div>

    <div class="form-container">
        <!-- Statistiques -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px;">
            <div class="stat-card" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 16px;">
                <h3>En attente</h3>
                <p class="stat-number" id="statEnAttente">0</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 20px; border-radius: 16px;">
                <h3>En cours</h3>
                <p class="stat-number" id="statEnCours">0</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 20px; border-radius: 16px;">
                <h3>Validées</h3>
                <p class="stat-number" id="statValidees">0</p>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 20px; border-radius: 16px;">
                <h3>Rejetées</h3>
                <p class="stat-number" id="statRejetees">0</p>
            </div>
        </div>

        <!-- Filtres -->
        <div class="form-card">
            <div class="form-section-title"><i class="fas fa-filter"></i> Filtrer les demandes</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Type d'acte</label>
                    <select id="filterType">
                        <option value="">Tous</option>
                        <option value="naissance">Naissance</option>
                        <option value="mariage">Mariage</option>
                        <option value="deces">Décès</option>
                        <option value="reconnaissance">Reconnaissance</option>
                        <option value="adoption">Adoption</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select id="filterStatut">
                        <option value="">Tous</option>
                        <option value="en_attente">En attente</option>
                        <option value="en_cours">En cours</option>
                        <option value="valide_agent">Validé agent</option>
                        <option value="valide_citoyen">Validé citoyen</option>
                        <option value="signe">Signé</option>
                        <option value="rejete">Rejeté</option>
                        <option value="delivre">Délivré</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date début</label>
                    <input type="date" id="filterDateDebut">
                </div>
                <div class="form-group">
                    <label>Date fin</label>
                    <input type="date" id="filterDateFin">
                </div>
            </div>
            <button class="btn-primary" id="applyFilters">Appliquer les filtres</button>
        </div>

        <!-- Liste des demandes -->
        <div class="form-card" style="margin-top: 24px;">
            <div class="form-section-title"><i class="fas fa-list"></i> Demandes d'actes</div>
            <div class="demandes-list" id="demandesList">
                <div class="loading-container"><div class="spinner"></div><p>Chargement...</p></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Modal traitement -->
    <div id="traitementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Traiter la demande</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="../../../js/api.js"></script>
    <script src="../../../js/modules/etat-civil-admin.js"></script>
</body>
</html>
