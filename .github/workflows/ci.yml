name: CI - Municipal Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r ../requirements.txt
        pip install flake8
    
    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --count --statistics || true
    
    - name: Run Django tests
      run: |
        cd backend
        python manage.py test || true

  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci || npm install
    
    - name: Build
      run: |
        cd frontend
        npm run build || echo "No build script"
