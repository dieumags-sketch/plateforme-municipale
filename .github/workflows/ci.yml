name: CI - Municipal Platform (Django + Frontend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # JOB 1 : Tests backend Django
  backend-tests:
    name: Backend Django - Tests
    runs-on: ubuntu-latest

    services:
      # Base de données pour les tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Mettre en cache les dépendances
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Installer les dépendances Django
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Vérifier le code avec flake8 (linter)
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      # 6. Exécuter les tests Django
      - name: Run Django tests
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py test

  # JOB 2 : Vérifier le frontend (HTML/CSS/JS)
  frontend-checks:
    name: Frontend - Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Vérifier le HTML
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v8
        with:
          root: ./
          log_level: WARN

      # 2. Vérifier les fichiers CSS
      - name: Lint CSS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g stylelint stylelint-config-standard
      - run: stylelint "**/*.css" --allow-empty-input

      # 3. Vérifier les fichiers JavaScript
      - name: Lint JavaScript
        run: |
          npm install -g eslint
          eslint "**/*.js" --fix || true

  # JOB 3 : Build et vérification finale
  build-check:
    name: Build & Static Files
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Check for missing static files
        run: |
          if [ ! -d "staticfiles" ]; then
            echo "❌ Static files collection failed"
            exit 1
          else
            echo "✅ Static files collected successfully"
          fi
